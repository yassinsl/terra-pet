<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
    <title>Terra</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      canvas {
        display: block;
        /* Keeps pixels sharp when the display scales the canvas (Retina). */
        image-rendering: pixelated;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="pet" width="256" height="320"></canvas>
    <script src="animations.js"></script>
    <script src="emotes.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
